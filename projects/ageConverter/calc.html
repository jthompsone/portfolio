<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="../../css/styles.css" />
        <link rel="stylesheet" type="text/css" href="css/style.css" />
        <link rel="stylesheet" type="text/css" href="css/calcStyle.css" />
        <title>Age Converter - Calculator</title>
    </head>
    <body>
        <header class="backToProjects">
            <a href="../../projects.html">Back to All Projects</a>
        </header>
        <div id="acMenuArea">
            <ul id="acMenu">
                <li><a href="about.html">About</a></li>
                <li><a href="calc.html" id="here">Converter</a></li>
                <li><a href="data.html">Creator</a></li>
            </ul>
        </div>
        <div id="acMain">
            <p>
                Use this
                <a href="data/ancestries.txt" class="inlineLink" download
                    >ancestries.txt</a
                >
                file to load data and run calculator.
            </p>
            <input type="file" name="inFile" id="fileInButton" accept=".txt" />
            <div class="container">
                <div class="parent">
                    <div class="one">
                        <div class="listSelect" id="sListOne"></div>
                        <p id="descript1"></p>
                    </div>
                    <div class="two">
                        <div class="listSelect" id="sListTwo"></div>
                        <p id="descript2"></p>
                    </div>
                    <div class="three">
                        <p id="inputDescript">Input age:</p>
                        <input
                            type="number"
                            name="inputAge"
                            id="inputAgetxt"
                            placeholder="Base age"
                            step="1"
                            min="1"
                            required
                        />
                    </div>
                    <div class="four">
                        <p id="outputDescript">Relative age result:</p>
                        <input
                            type="text"
                            name="resultingAge"
                            id="outputAgetxt"
                            placeholder="Resulting age"
                            readonly
                        />
                        <input
                            type="button"
                            name="calculateBtn"
                            id="calcButton"
                            value="Calculate"
                            onclick="validateInput()"
                        />
                    </div>
                </div>
            </div>
        </div>
        <script src="js/converter.js"></script>
    </body>
</html>
